<!DOCTYPE html>
<html lang="zh-Hant">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0" />

  <title>
    Miya 越式洗髮館｜高雄左營奢華越式洗髮・頭皮舒壓・肩頸放鬆
  </title>

  <meta name="description"
        content="Miya 越式洗髮館位於高雄左營華夏路557號。主打越式洗髮、頭皮舒壓、肩頸按摩、臉部清潔、香草水療與深度放鬆。">

  <!-- Google Fonts -->

  <link rel="preconnect"
        href="https://fonts.googleapis.com">

  <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap"
        rel="stylesheet">

  <style>

    :root{

      --emerald:#043927;
      --emerald-dark:#021a12;
      --gold:#e7c9a4;
      --cream:#fff6e8;
      --line:rgba(231,201,164,.18);
      --shadow:0 24px 70px rgba(0,0,0,.35);
      --radius:28px;
    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{

      font-family:"Noto Sans TC",sans-serif;

      background:
      radial-gradient(circle at top right,
      rgba(10,77,54,.9),
      transparent 30%),

      linear-gradient(
      180deg,
      #021a12,
      #031712);

      color:var(--cream);

      line-height:1.8;

      overflow-x:hidden;
    }

    a{
      text-decoration:none;
      color:inherit;
    }

    img{
      width:100%;
      display:block;
      object-fit:cover;
    }

    /* =========================
       TOPBAR
    ========================== */

    .topbar{

      position:fixed;

      top:0;
      left:0;

      width:100%;

      z-index:1000;

      backdrop-filter:blur(20px);

      background:rgba(2,26,18,.8);

      border-bottom:1px solid var(--line);
    }

    .nav{

      max-width:1280px;

      margin:auto;

      padding:18px 24px;

      display:flex;

      align-items:center;

      justify-content:space-between;
    }

    .brand{

      display:flex;

      align-items:center;

      gap:12px;

      color:var(--gold);

      font-family:"Cormorant Garamond",serif;

      letter-spacing:4px;

      font-size:28px;
    }

    .logo{

      width:42px;

      height:42px;

      border-radius:50%;

      border:1px solid var(--gold);

      display:grid;

      place-items:center;
    }

    .nav-links{

      display:flex;

      gap:28px;

      align-items:center;
    }

    .nav-links a{

      font-size:14px;

      color:rgba(255,246,232,.7);
    }

    .nav-links a:hover{

      color:var(--gold);
    }

    /* =========================
       BUTTONS
    ========================== */

    .btn{

      display:inline-flex;

      align-items:center;

      justify-content:center;

      padding:14px 26px;

      border-radius:999px;

      font-weight:700;

      transition:.3s ease;
    }

    .btn:hover{

      transform:translateY(-2px);
    }

    .btn-gold{

      background:var(--gold);

      color:var(--emerald-dark);
    }

    .btn-line{

      background:#06c755;

      color:white;
    }

    .btn-outline{

      border:1px solid rgba(231,201,164,.4);

      color:var(--gold);
    }

    /* =========================
       HERO
    ========================== */

    .hero{

      min-height:100vh;

      display:flex;

      align-items:center;

      padding:140px 24px 80px;
    }

    .hero-inner{

      max-width:1280px;

      margin:auto;

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:50px;

      align-items:center;
    }

    .eyebrow{

      color:var(--gold);

      letter-spacing:5px;

      font-size:16px;

      margin-bottom:18px;

      font-family:"Cormorant Garamond",serif;
    }

    h1{

      font-family:"Cormorant Garamond",serif;

      font-size:100px;

      line-height:.9;

      color:var(--gold);

      margin-bottom:20px;

      font-weight:300;
    }

    .hero h2{

      font-size:46px;

      line-height:1.3;

      margin-bottom:22px;
    }

    .lead{

      color:rgba(255,246,232,.76);

      font-size:18px;

      margin-bottom:32px;
    }

    .hero-actions{

      display:flex;

      gap:14px;

      flex-wrap:wrap;
    }

    .trust-grid{

      margin-top:32px;

      display:grid;

      grid-template-columns:repeat(4,1fr);

      gap:12px;
    }

    .trust{

      border:1px solid var(--line);

      border-radius:20px;

      padding:18px;

      background:rgba(255,255,255,.04);
    }

    .trust strong{

      display:block;

      color:var(--gold);

      font-size:24px;
    }

    .trust span{

      font-size:13px;

      color:rgba(255,246,232,.7);
    }

    /* =========================
       HERO GALLERY
    ========================== */

    .hero-gallery{

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:16px;
    }

    .hero-photo{

      border-radius:30px;

      overflow:hidden;

      min-height:260px;

      border:1px solid var(--line);

      box-shadow:var(--shadow);
    }

    .hero-photo.big{

      grid-row:span 2;

      min-height:540px;
    }

    /* =========================
       SECTION
    ========================== */

    section{

      padding:90px 24px;
    }

    .container{

      max-width:1280px;

      margin:auto;
    }

    .section-head{

      text-align:center;

      max-width:820px;

      margin:0 auto 50px;
    }

    .mini{

      color:var(--gold);

      letter-spacing:4px;

      margin-bottom:10px;

      display:block;

      font-family:"Cormorant Garamond",serif;
    }

    .section-head h2{

      font-size:54px;

      line-height:1.2;

      margin-bottom:16px;

      color:var(--gold);
    }

    .section-head p{

      color:rgba(255,246,232,.72);
    }

    /* =========================
       SERVICES
    ========================== */

    .services-grid{

      display:grid;

      grid-template-columns:repeat(3,1fr);

      gap:24px;
    }

    .package{

      border:1px solid var(--line);

      border-radius:34px;

      padding:34px;

      background:rgba(255,255,255,.04);
    }

    .package.featured{

      border-color:rgba(231,201,164,.5);

      background:rgba(231,201,164,.06);
    }

    .tag{

      display:inline-block;

      border:1px solid var(--line);

      border-radius:999px;

      padding:6px 12px;

      color:var(--gold);

      margin-bottom:20px;

      font-size:13px;
    }

    .package h3{

      color:var(--gold);

      font-size:34px;

      margin-bottom:6px;
    }

    .price{

      font-size:28px;

      margin-bottom:22px;
    }

    .package ul{

      list-style:none;

      margin-bottom:28px;
    }

    .package li{

      margin:12px 0;

      color:rgba(255,246,232,.75);
    }

    /* =========================
       GALLERY
    ========================== */

    .photo-grid{

      display:grid;

      grid-template-columns:repeat(4,1fr);

      gap:16px;
    }

    .photo{

      border-radius:28px;

      overflow:hidden;

      min-height:250px;

      border:1px solid var(--line);
    }

    .photo.tall{

      grid-row:span 2;

      min-height:520px;
    }

    .photo.wide{

      grid-column:span 2;
    }

    /* =========================
       REVIEWS
    ========================== */

    .reviews-grid{

      display:grid;

      grid-template-columns:repeat(3,1fr);

      gap:20px;
    }

    .review{

      border:1px solid var(--line);

      border-radius:28px;

      padding:28px;

      background:rgba(255,255,255,.04);
    }

    .stars{

      color:var(--gold);

      letter-spacing:4px;

      margin-bottom:12px;
    }

    .review p{

      color:rgba(255,246,232,.8);

      margin-bottom:16px;
    }

    .review strong{

      color:var(--gold);
    }

    /* =========================
       VISIT
    ========================== */

    .visit-card{

      display:grid;

      grid-template-columns:1fr 1fr;

      gap:30px;

      border:1px solid var(--line);

      border-radius:40px;

      padding:40px;

      background:rgba(255,255,255,.04);
    }

    .visit-card h2{

      font-size:52px;

      line-height:1.2;

      margin-bottom:20px;

      color:var(--gold);
    }

    .info-list{

      margin:26px 0;

      display:grid;

      gap:12px;

      color:rgba(255,246,232,.75);
    }

    .mapbox{

      min-height:380px;

      border-radius:30px;

      overflow:hidden;

      border:1px solid var(--line);

      background:url("assets/miya-4.png") center/cover;
    }

    /* =========================
       LANGUAGE SWITCHER
    ========================== */

    .language-switcher{

      position:fixed;

      right:18px;

      bottom:90px;

      z-index:9999;

      display:flex;

      flex-direction:column;

      gap:10px;
    }

    .language-switcher button{

      background:rgba(2,26,18,.85);

      color:#e7c9a4;

      border:1px solid rgba(231,201,164,.35);

      border-radius:999px;

      padding:10px 16px;

      cursor:pointer;

      font-weight:700;

      backdrop-filter:blur(14px);

      transition:.3s ease;
    }

    .language-switcher button:hover{

      background:#e7c9a4;

      color:#021a12;
    }

    /* =========================
       FOOTER
    ========================== */

    footer{

      text-align:center;

      padding:50px 24px 100px;

      color:rgba(255,246,232,.45);

      border-top:1px solid var(--line);

      font-size:14px;
    }

  </style>

</head>

<body>

  <header class="topbar">

    <nav class="nav">

      <a href="#" class="brand">

        <div class="logo">M</div>

        <span>MIYA</span>

      </a>

      <div class="nav-links">

        <a href="#services">療程方案</a>

        <a href="#gallery">店內環境</a>

        <a href="#reviews">顧客評價</a>

        <a href="#visit">立即預約</a>

      </div>

    </nav>

  </header>

  <section class="hero">

    <div class="hero-inner">

      <div>

        <div class="eyebrow">
          Vietnamese Hair Spa · Kaohsiung
        </div>

        <h1>MIYA</h1>

        <h2>
          不是只是洗頭，<br>
          而是一場讓身心重新開機的療癒儀式。
        </h2>

        <p class="lead">
          Miya 越式洗髮館結合越式洗髮、頭皮舒壓、肩頸按摩、
          草本香氛與深層放鬆，讓你在高雄左營找到真正能放空的地方。
        </p>

      </div>

    </div>

  </section>

  <!-- LANGUAGE SWITCHER -->

  <div class="language-switcher">

    <button onclick="setLanguage('zh')">
      繁中
    </button>

    <button onclick="setLanguage('en')">
      EN
    </button>

    <button onclick="setLanguage('ja')">
      日本語
    </button>

    <button onclick="setLanguage('ko')">
      한국어
    </button>

    <button onclick="setLanguage('vi')">
      Tiếng Việt
    </button>

  </div>

  <footer>

    © Miya 越式洗髮館

  </footer>

  <script>

    const translations = {

      zh:{
        heroTitle:"不是只是洗頭，<br>而是一場讓身心重新開機的療癒儀式。",
        heroLead:"Miya 越式洗髮館結合越式洗髮、頭皮舒壓、肩頸按摩、草本香氛與深層放鬆，讓你在高雄左營找到真正能放空的地方。"
      },

      en:{
        heroTitle:"Not just a hair wash,<br>but a healing ritual for your body and mind.",
        heroLead:"Miya combines Vietnamese shampoo therapy, scalp relaxation, shoulder massage, herbal aroma and deep healing in Kaohsiung."
      },

      ja:{
        heroTitle:"ただの洗髪ではなく、<br>心と身体を癒すリラクゼーション体験。",
        heroLead:"Miyaはベトナム式シャンプー、頭皮ケア、肩首マッサージを融合した癒し空間です。"
      },

      ko:{
        heroTitle:"단순한 샴푸가 아닌,<br>몸과 마음을 위한 힐링 의식.",
        heroLead:"Miya는 베트남식 샴푸와 두피 케어를 제공합니다."
      },

      vi:{
        heroTitle:"Không chỉ là gội đầu,<br>mà là một hành trình chữa lành.",
        heroLead:"Miya kết hợp gội đầu Việt Nam và massage thư giãn."
      }
    };

    function setLanguage(lang){

      const t = translations[lang];

      document.querySelector(".hero h2").innerHTML =
      t.heroTitle;

      document.querySelector(".lead").innerHTML =
      t.heroLead;

      localStorage.setItem(
      "miya-language",
      lang);
    }

    document.addEventListener(
    "DOMContentLoaded",
    ()=>{

      const savedLang =
      localStorage.getItem("miya-language")
      || "zh";

      setLanguage(savedLang);
    });

  </script>

</body>

</html>
